<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Smelliest Pilgrim · trail memos</title>
<style>
  :root { color-scheme: light dark; --fg:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --bg:#fff; --card:#f5f5f7; --accent:#0a7d55; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c; --bg:#000; --card:#1c1c1e; --accent:#30d158; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
  input[type=password] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  button, .btn { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: #d70015; }
  .days { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .days button.on { border-color: var(--accent); outline: 2px solid var(--accent); }
  .memo { border-top: 1px solid var(--line); padding: 12px 0; }
  .memo:first-child { border-top: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .time { font-weight: 600; font-size: 18px; }
  audio { width: 100%; margin-top: 8px; }
  .err { color: #d70015; }
  label { font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Smelliest Pilgrim</h1>
  <div class="muted">Voice memos from the Memo watch app. Only someone with this server's token can see or play them.</div>

  <div id="login" class="card" hidden>
    <form id="loginForm">
      <label for="token">Token</label>
      <input id="token" type="password" autocomplete="current-password" required>
      <div class="row" style="margin-top:10px">
        <label><input id="remember" type="checkbox"> Remember on this device</label>
        <button class="primary" type="submit">Open</button>
      </div>
      <div id="loginErr" class="err"></div>
    </form>
  </div>

  <div id="app" hidden>
    <div class="row" style="justify-content:space-between">
      <div class="days" id="days"></div>
      <button id="logout" type="button">Forget token</button>
    </div>
    <div id="dayInfo" class="muted"></div>
    <div id="memos" class="card"></div>
    <div id="logs" class="muted"></div>
  </div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
